name: migration-test

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-coverage:
    name: migration unit coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run unit tests with coverage
        run: make migration/test-unit
      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: migration-unit-coverage
          path: artifacts/coverage
          if-no-files-found: ignore

  fixture:
    name: migration fixture E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set up fixture cluster
        run: make migration/e2e-fixture-setup
      - name: Run fixture migration tests
        run: make migration/test-e2e-fixture-matrix
      - name: Verify batch selection and dry-run safety
        run: make migration/test-e2e-batch
      - name: Verify fixture acceptance cases
        run: make migration/test-e2e-acceptance
      - name: Verify soft acknowledgments and hard-block refusal
        run: make migration/test-e2e-acknowledgments
      - name: Verify backup contents and deletion ordering
        run: make migration/test-e2e-backup
      - name: Verify cross-namespace fixture migration
        run: make migration/test-e2e-cross-namespace
      - name: Verify system-managed namespace fixture migration
        run: make migration/test-e2e-system-managed-namespace
      - name: Tear down fixture cluster
        if: always()
        run: E2E_CLUSTER_NAME=library-olm-fixture-e2e make migration/e2e-teardown
      - name: Upload fixture diagnostics and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: migration-fixture-e2e-artifacts
          path: artifacts/e2e
          if-no-files-found: ignore

  cos-supersession:
    name: migration COS supersession E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set up fixture cluster
        run: make migration/e2e-fixture-setup
      - name: Verify migrated ClusterObjectSet supersession
        run: make migration/test-e2e-cos-supersession
      - name: Tear down fixture cluster
        if: always()
        run: E2E_CLUSTER_NAME=library-olm-fixture-e2e make migration/e2e-teardown
      - name: Upload COS supersession diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: migration-cos-supersession-e2e-artifacts
          path: artifacts/e2e
          if-no-files-found: ignore

  cod-handoff-rollback:
    name: migration COD handoff and rollback E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      E2E_FIXTURE_CLUSTER_NAME: library-olm-cod-e2e
      E2E_FIXTURE_KUBECONFIG: ${{ github.workspace }}/operator-controller/.kubeconfig/library-olm-cod-e2e.kubeconfig
      E2E_COVERAGE_DIR: ${{ github.workspace }}/artifacts/e2e/coverage/cod
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: operator-framework/operator-controller
          ref: 255a40262ba4d525fd70d4e211bddfcd47a9fcab
          path: operator-controller
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and deploy pinned COD-capable controller
        run: make -C operator-controller run-experimental KIND_CLUSTER_NAME=library-olm-cod-e2e K8S_VERSION=1.36
      - name: Install committed OLMv0 fixtures and catalog
        run: make migration/e2e-fixture-setup
      - name: Verify COD handoff and catalog revision
        run: make migration/test-e2e-cos-supersession
      - name: Verify COD rollback preserves the workload
        run: make migration/test-e2e-cod-rollback
      - name: Tear down COD cluster
        if: always()
        run: E2E_CLUSTER_NAME=library-olm-cod-e2e make migration/e2e-teardown
      - name: Upload COD diagnostics and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: migration-cod-e2e-artifacts
          path: artifacts/e2e
          if-no-files-found: ignore

  in-cluster-job:
    name: migration in-cluster Job E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run in-cluster migration Job test
        run: make migration/test-e2e-in-cluster-job
      - name: Tear down fixture cluster
        if: always()
        run: E2E_CLUSTER_NAME=library-olm-fixture-e2e make migration/e2e-teardown

  coverage:
    name: migration total coverage
    needs: [unit-coverage, fixture, cos-supersession, cod-handoff-rollback, live]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Download unit coverage
        uses: actions/download-artifact@v8
        with:
          name: migration-unit-coverage
          path: artifacts/coverage
      - name: Download fixture E2E coverage
        uses: actions/download-artifact@v8
        with:
          name: migration-fixture-e2e-artifacts
          path: artifacts/e2e
      - name: Download COS supersession E2E coverage
        uses: actions/download-artifact@v8
        with:
          name: migration-cos-supersession-e2e-artifacts
          path: artifacts/e2e
      - name: Download COD E2E coverage
        uses: actions/download-artifact@v8
        with:
          name: migration-cod-e2e-artifacts
          path: artifacts/e2e
      - name: Download live E2E coverage
        uses: actions/download-artifact@v8
        with:
          name: migration-live-e2e-artifacts
          path: artifacts/e2e
      - name: Display combined coverage
        run: make migration/report-coverage-all

  live:
    name: migration live-operator E2E
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set up live cluster
        run: make migration/e2e-setup
      - name: Run live-operator migration tests
        run: make migration/test-e2e-live-matrix
      - name: Verify live four-state batch selection
        run: make migration/test-e2e-live-batch
      - name: Verify acknowledged live source-namespace deletion
        run: make migration/test-e2e-live-namespace-delete
      - name: Tear down live cluster
        if: always()
        run: make migration/e2e-teardown
      - name: Upload live diagnostics and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: migration-live-e2e-artifacts
          path: artifacts/e2e
          if-no-files-found: ignore
