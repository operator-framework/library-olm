# Fixture clusters deliberately omit the OLMv0 controllers. The migrated
# Subscription snapshots still reference this source, so retain the source
# object as committed fixture input for catalog migration and resolution.
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: operatorhubio-catalog
  namespace: olm
spec:
  sourceType: grpc
  # This image is built from the committed operator snapshots during fixture
  # setup and served by the in-cluster fixture registry. It deliberately does
  # not depend on an OperatorHub image or a retained Quay digest.
  image: fixture-registry.migration-e2e-registry.svc.cluster.local:5000/library-olm-fixture-catalog:latest
